<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Array Academy: Arrays from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec; --paper:#fffdf8; --ink:#1d1b16; --muted:#6b665b; --line:#e3ddcf;
    --accent:#e2603a; --accent-soft:#fbe3d8; --good:#2f8f5b; --good-soft:#dcf1e4;
    --bad:#c23b3b; --bad-soft:#f8dddd; --blue:#2c5fd6; --blue-soft:#dfe7fb;
    --code-bg:#1f1d1a; --code-ink:#f2ede1; --yellow:#f3c64b;
    --mono:'JetBrains Mono', ui-monospace, monospace; --sans:'Space Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  aside{background:var(--paper);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand .logo{font-family:var(--mono);background:var(--ink);color:var(--yellow);border-radius:8px;padding:2px 7px;font-size:15px}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 18px}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .progress > div{height:100%;background:var(--accent);width:0;transition:width .4s}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:18px}
  .nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14.5px;margin-bottom:2px}
  .nav button:hover{background:var(--bg)}
  .nav button.active{background:var(--ink);color:#fff}
  .nav .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-family:var(--mono);flex:none}
  .nav button.active .dot{border-color:#fff}
  .nav button.done .dot{background:var(--good);border-color:var(--good);color:#fff}
  .reset{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-top:16px;text-decoration:underline}
  main{padding:34px clamp(18px,4vw,56px) 80px;max-width:980px}
  .eyebrow{font-family:var(--mono);font-size:12.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
  h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.1;margin:6px 0 10px}
  h2{font-size:21px;letter-spacing:-.02em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
  h2 .tag{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ink);color:#fff;padding:3px 7px;border-radius:6px;letter-spacing:.04em}
  .lead{font-size:18px;color:#3b372f;max-width:680px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:20px 0}
  .card p{margin:0 0 12px}
  code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);color:#8a2f14;padding:1px 6px;border-radius:5px}
  pre{font-family:var(--mono);font-size:14px;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:12px;overflow:auto;margin:10px 0 14px;line-height:1.6}
  pre .c{color:#8f897b} pre .s{color:#a7d98b} pre .n{color:#f3c64b} pre .k{color:#f08a65}
  .analogy{display:flex;gap:14px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:14px 16px;margin:12px 0}
  .analogy .ico{font-size:24px;line-height:1}
  .tip{border-left:4px solid var(--yellow);background:#fdf6dc;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:15px}

  /* array boxes */
  .arr{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;min-height:92px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .28s ease}
  .box{min-width:72px;height:58px;padding:0 10px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px;transition:all .2s;cursor:default}
  .clickable .box{cursor:pointer}
  .clickable .box:hover{transform:translateY(-3px);box-shadow:0 4px 0 var(--ink)}
  .idx{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .cell.hl .box{background:var(--yellow);transform:translateY(-4px);box-shadow:0 4px 0 var(--ink)}
  .cell.hl .idx{color:var(--ink);font-weight:600}
  .cell.match .box{background:var(--good);color:#fff;border-color:var(--good)}
  .cell.dim .box{opacity:.35}
  .cell.out .box{background:var(--blue-soft);border-color:var(--blue)}
  .empty-arr{font-family:var(--mono);color:var(--muted);padding:18px 0}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .readout{font-family:var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px 14px;font-size:14px;min-height:42px;white-space:pre-wrap}
  .readout b{color:var(--yellow);font-weight:600}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .btn{all:unset;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;background:var(--ink);color:#fff;transition:transform .1s}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:7.5px 12.5px}
  .btn.accent{background:var(--accent)}
  .btn.mono{font-family:var(--mono);font-weight:600;font-size:13px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  input[type=text],input[type=number],select{font-family:var(--mono);font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--ink)}
  input[type=number]{width:80px}

  /* quiz */
  .q{margin:0 0 20px}
  .q:last-child{margin-bottom:0}
  .q-title{font-weight:600;margin-bottom:8px}
  .opts{display:grid;gap:8px}
  .opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;font-size:15px;display:flex;gap:10px;align-items:center}
  .opt:hover{border-color:var(--ink)}
  .opt .letter{font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
  .opt.right{border-color:var(--good);background:var(--good-soft)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .why{font-size:14.5px;margin-top:8px;padding:8px 12px;border-radius:8px}
  .why.right{background:var(--good-soft)} .why.wrong{background:var(--bad-soft)}

  /* editor */
  .task{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:12px}
  .task ol{margin:6px 0 0;padding-left:20px}
  .editor{width:100%;min-height:200px;font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--code-bg);color:var(--code-ink);border:none;border-radius:12px;padding:14px 16px;resize:vertical;outline:none;tab-size:2;caret-color:var(--yellow)}
  .editor:focus{box-shadow:0 0 0 3px var(--yellow)}
  .console{font-family:var(--mono);font-size:13.5px;background:#2a2723;color:#d9d3c5;border-radius:12px;padding:12px 16px;margin-top:10px;min-height:44px;white-space:pre-wrap}
  .console .lbl{color:#8f897b;font-size:11px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:4px}
  .console .err{color:#ff8f8f}
  .results{margin-top:10px;display:grid;gap:6px}
  .res{font-size:14.5px;padding:8px 12px;border-radius:8px;display:flex;gap:8px}
  .res.pass{background:var(--good-soft)} .res.fail{background:var(--bad-soft)}
  .hint{display:none;margin-top:10px;font-size:14.5px}
  .hint.show{display:block}

  .stage-done{display:none;background:var(--good);color:#fff;border-radius:16px;padding:18px 22px;margin:20px 0;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .stage-done.show{display:flex}
  .stage-done .btn{background:#fff;color:var(--good)}
  .checklist{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:4px}
  .checklist span.ok{color:var(--good);font-weight:600}
  .footer-nav{display:flex;justify-content:space-between;margin-top:30px}
  .loopcode{font-family:var(--mono);font-size:14px;background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px 0;margin:10px 0}
  .loopcode div{padding:1px 16px;border-left:4px solid transparent}
  .loopcode div.on{background:#3a352c;border-left-color:var(--yellow)}
  .vars{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
  .var{font-family:var(--mono);font-size:14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px}
  .var b{color:var(--accent)}
  .row-label{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px}
  .cheats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .cheat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
  .cheat code{display:inline-block;margin-bottom:4px}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .result-hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .grade{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat .num{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
  .stat .lab{font-size:13px;color:var(--muted)}
  .rtable{display:grid;gap:2px;font-size:14.5px}
  .rrow{display:grid;grid-template-columns:1.3fr 1fr 1.6fr 1fr;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
  .rrow.head{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .sc{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
  .minibar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:40px}
  .minibar i{display:block;height:100%}
  @media (max-width:640px){ .rrow{grid-template-columns:1fr 1fr} .rrow.head{display:none} }
  .nav-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 10px 6px}
  .nav-h:first-child{margin-top:0}
  .nav-sub{font-size:12px;color:var(--accent);font-family:var(--mono);margin:8px 10px 4px}
  .nav button.locked{opacity:.5}
  .cell.miss .box{background:var(--bad);color:#fff;border-color:var(--bad)}
  .pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;vertical-align:middle}
  .pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
  .refrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .refname{min-width:170px}
  table.rec{border-collapse:collapse;font-family:var(--mono);font-size:13.5px;margin:6px 0 10px;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--ink)}
  table.rec th,table.rec td{padding:6px 14px;text-align:left;border-bottom:1px solid var(--line)}
  table.rec th{background:var(--ink);color:#fff;font-weight:600}
  table.rec td.i{color:var(--muted)}
  table.rec tr.on td{background:#fdf0bf}
  table.rec td.cell-on{background:var(--yellow)!important;font-weight:700}
  .grid2d{display:grid;gap:6px;margin:12px 0;align-items:center}
  .gl{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}
  .gc{height:56px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:600;cursor:pointer;transition:all .15s}
  .gc:hover{transform:translateY(-2px)}
  .gc.row{background:var(--blue-soft);border-color:var(--blue)}
  .gc.seen{background:var(--good-soft)}
  .gc.on{background:var(--yellow);box-shadow:0 4px 0 var(--ink);transform:translateY(-3px)}
  .pstep{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:6px 0}
  .pstep.off{border-left-color:var(--line);opacity:.55}
  .pcode{font-family:var(--mono);font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-family:var(--mono);font-size:13px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px}
  .chip small{color:var(--accent);font-weight:600}
  .chip.str{background:var(--blue-soft);border-color:var(--blue)}
  .menu-toggle{display:none}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .nav{display:none}
    aside.open .nav{display:block}
    .menu-toggle{display:inline-block;margin-bottom:8px}
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo">[ ]</span> Array Academy</div>
    <div class="sub">Arrays from zero to advanced, in JavaScript</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-label" id="barLabel"></div>
    <button class="btn ghost menu-toggle" id="menuBtn">Show stages</button>
    <nav class="nav" id="nav"></nav>
    <button class="reset" id="resetBtn">Reset my progress</button>
  </aside>
  <main id="main"></main>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, html='') => { const e=document.createElement(tag); for(const k in attrs){ if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(html) e.innerHTML=html; return e; };
const fmt = v => typeof v === 'string' ? `"${v}"` : (Array.isArray(v) ? '[' + v.map(fmt).join(', ') + ']' : (v && typeof v==='object' ? JSON.stringify(v) : String(v)));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function renderBoxes(el, arr, opts={}){
  el.innerHTML='';
  el.className = 'arr' + (opts.onClick ? ' clickable' : '');
  if(!arr.length){ el.innerHTML='<div class="empty-arr">[ ]  ← empty array, length 0</div>'; return; }
  arr.forEach((v,i)=>{
    const c = h('div',{class:'cell' + (opts.cls && opts.cls(i) ? ' '+opts.cls(i) : '')});
    const b = h('div',{class:'box'}, esc(fmt(v)));
    if(opts.onClick) b.addEventListener('click',()=>opts.onClick(i));
    c.append(b, h('div',{class:'idx'}, opts.noIndex ? '' : String(i)));
    el.append(c);
  });
}

/* ---------- progress (per-browser convenience only) ---------- */
let progress = {};
try { progress = JSON.parse(localStorage.getItem('arrayAcademy') || '{}'); } catch(e){ progress = {}; }
function save(){ try{ localStorage.setItem('arrayAcademy', JSON.stringify(progress)); }catch(e){} }
function stageState(id){
  const st = progress[id] || (progress[id] = {});
  return Object.assign(st, Object.assign({quiz:{}, qWrong:{}, code:false, draft:null, runs:0, hint:false, sol:false}, st));
}

/* ---------- sandboxed code runner (Web Worker, with timeout) ---------- */
const workerSrc = `
self.onmessage = (e) => {
  const logs = [];
  const fmt = v => typeof v === 'string' ? JSON.stringify(v) : (Array.isArray(v) ? '[' + v.map(fmt).join(', ') + ']' : (v && typeof v==='object' ? JSON.stringify(v) : String(v)));
  self.console = { log: (...a) => logs.push(a.map(x => typeof x === 'string' ? x : fmt(x)).join(' ')) };
  try {
    const fn = new Function(e.data.code + '\\n;return (' + e.data.extract + ');');
    const vals = fn();
    self.postMessage({ ok:true, logs, vals: JSON.parse(JSON.stringify(vals === undefined ? null : vals, (k,v)=> v===undefined ? '__undef__' : v)) });
  } catch(err){
    self.postMessage({ ok:false, logs, error: err.name + ': ' + err.message });
  }
};`;
const workerURL = URL.createObjectURL(new Blob([workerSrc], {type:'text/javascript'}));
function runCode(code, extract){
  return new Promise(resolve=>{
    let w;
    try { w = new Worker(workerURL); } catch(e){
      // fallback: run inline (no infinite-loop protection)
      const logs=[]; const orig=console.log; console.log=(...a)=>logs.push(a.map(x=>typeof x==='string'?x:fmt(x)).join(' '));
      try{ const vals=new Function(code+'\n;return ('+extract+');')(); console.log=orig; resolve({ok:true,logs,vals:JSON.parse(JSON.stringify(vals,(k,v)=>v===undefined?'__undef__':v))}); }
      catch(err){ console.log=orig; resolve({ok:false,logs,error:err.name+': '+err.message}); }
      return;
    }
    const t = setTimeout(()=>{ w.terminate(); resolve({ok:false, logs:[], error:'Your code took too long. Is there a loop that never stops?'}); }, 2500);
    w.onmessage = e => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.postMessage({code, extract});
  });
}
const varsExtract = names => '{' + names.map(n => `${n}: (typeof ${n} !== 'undefined' ? ${n} : '__missing__')`).join(', ') + '}';
const missing = v => v === '__missing__';

/* ---------- course content ---------- */
const STAGES = [
/* 1 */ {
  id:'what', title:'What is an array?', short:'What is an array?',
  lead:'An array is a single variable that holds an <b>ordered list</b> of values. Instead of making ten separate variables, you keep them together in one.',
  lesson:`
    <div class="analogy"><div class="ico">🚃</div><div>Picture a <b>train</b>. The whole train has one name (<code>train</code>), and each carriage holds one thing. The carriages stay in order, and you can add or remove carriages later.</div></div>
    <p>Without arrays, storing three friends looks like this:</p>
<pre><span class="k">let</span> friend1 = <span class="s">"Aisha"</span>;
<span class="k">let</span> friend2 = <span class="s">"Ben"</span>;
<span class="k">let</span> friend3 = <span class="s">"Chen"</span>;   <span class="c">// what about 100 friends? 😬</span></pre>
    <p>With an array, it's one variable. Square brackets <code>[ ]</code> make the array, and commas separate the items:</p>
<pre><span class="k">const</span> friends = [<span class="s">"Aisha"</span>, <span class="s">"Ben"</span>, <span class="s">"Chen"</span>];</pre>
    <p>An array can hold any kind of value: text (strings), numbers, true/false, even a mix:</p>
<pre><span class="k">const</span> scores  = [<span class="n">90</span>, <span class="n">72</span>, <span class="n">85</span>];
<span class="k">const</span> answers = [<span class="k">true</span>, <span class="k">false</span>, <span class="k">true</span>];
<span class="k">const</span> empty   = [];   <span class="c">// an array with nothing in it (yet)</span></pre>
    <div class="tip">💡 Text values need quotes (<code>"Ben"</code>). Numbers don't (<code>72</code>). A missing comma or bracket is the most common beginner error.</div>`,
  widgetTitle:'Build an array',
  widget(el){
    let arr = ['Aisha','Ben','Chen'];
    el.innerHTML = `<p>Type a value and add it. Watch the boxes <em>and</em> the code update together.</p>
      <div class="controls"><input type="text" id="w1in" placeholder="e.g. Dana or 42" maxlength="12"><button class="btn" id="w1add">Add item</button><button class="btn ghost" id="w1clr">Clear</button></div>
      <div id="w1arr"></div><div class="readout" id="w1code"></div>`;
    const draw=()=>{ renderBoxes($('#w1arr',el), arr, {noIndex:true}); $('#w1code',el).innerHTML = 'const myArray = <b>' + esc(fmt(arr)) + '</b>;'; };
    const add=()=>{ const raw=$('#w1in',el).value.trim(); if(!raw) return; const n=Number(raw); arr.push(raw!=='' && !isNaN(n) ? n : raw); $('#w1in',el).value=''; draw(); };
    $('#w1add',el).onclick=add; $('#w1in',el).onkeydown=e=>{ if(e.key==='Enter') add(); };
    $('#w1clr',el).onclick=()=>{arr=[];draw();};
    draw();
  },
  quiz:[
    {q:'Which line correctly creates an array?', opts:['const pets = "cat", "dog";','const pets = ["cat", "dog"];','const pets = (cat, dog);','const pets = {"cat" "dog"};'], a:1, why:'Arrays use square brackets, with commas between items. Text items go in quotes.'},

}</pre>
    <div class="tip">💡 Use <code>&lt;</code>, not <code>&lt;=</code>. With <code>i &lt;= prices.length</code> the last pass reads <code>prices[3]</code>, which is <code>undefined</code>. That's the classic "off-by-one" bug.</div>`,

        <div data-l="2">&nbsp;&nbsp;total = total + prices[i];</div>

        <div data-l="4">// done! total = ?</div>
      </div>
      <div id="w5arr"></div>

    <p><b>splice(start, deleteCount, ...newItems)</b> cuts into the original array. It removes and/or inserts items, and returns what it removed:</p>
<pre>a.splice(<span class="n">1</span>, <span class="n">2</span>)        <span class="c">// returns ["b","c"]; a is now ["a","d"]</span>

[<span class="n">10</span>, <span class="n">1</span>, <span class="n">5</span>].sort((a, b) =&gt; a - b)    <span class="c">// [1, 5, 10]  low → high</span>

/* A3 */ {
  id:'adv-copy', level:'adv', part:'Part 1 · Power tools', title:'Copies vs references, spread & destructuring', short:'Copies & spread',
  lead:'This is the concept behind a lot of confusing bugs: <b>assigning an array to a new variable does not copy it</b>. Both names point at the same array.',
  lesson:`
<pre><span class="k">const</span> a = [<span class="n">1</span>, <span class="n">2</span>, <span class="n">3</span>];
<span class="k">const</span> b = a;        <span class="c">// NOT a copy: b points at the same array</span>
b.push(<span class="n">4</span>);
console.log(a);     <span class="c">// [1, 2, 3, 4]  😮 a changed too!</span></pre>
    <div class="analogy"><div class="ico">🏠</div><div>A variable doesn't hold the array itself; it holds the array's <b>address</b>. <code>const b = a</code> copies the address, so now two people have the key to <i>the same house</i>. Rearrange the furniture through <code>b</code>, and <code>a</code> sees it too.</div></div>
    <p>To make a <b>real copy</b>, use the spread operator <code>...</code>, which "spreads out" the items into a brand-new array:</p>
<pre><span class="k">const</span> c = [...a];           <span class="c">// a new array with the same items</span>
<span class="k">const</span> both = [...a, ...[<span class="n">9</span>, <span class="n">8</span>]];  <span class="c">// merge arrays: [1, 2, 3, 4, 9, 8]</span>
[<span class="n">1</span>, <span class="n">2</span>] === [<span class="n">1</span>, <span class="n">2</span>]          <span class="c">// false: two different arrays, two different addresses</span></pre>
    <p><b>Destructuring</b> unpacks items into variables by position:</p>
<pre><span class="k">const</span> [first, second] = [<span class="s">"gold"</span>, <span class="s">"silver"</span>, <span class="s">"bronze"</span>];   <span class="c">// "gold", "silver"</span>
<span class="k">const</span> [winner, ...rest] = [<span class="s">"gold"</span>, <span class="s">"silver"</span>, <span class="s">"bronze"</span>]; <span class="c">// rest = ["silver", "bronze"]</span>
<span class="k">let</span> x = <span class="n">1</span>, y = <span class="n">2</span>;
[x, y] = [y, x];   <span class="c">// swap! x = 2, y = 1</span></pre>
    <div class="tip">💡 In React, state updates rely on this. <code>setItems([...items, newItem])</code> creates a new array so React notices the change. <code>items.push(newItem)</code> keeps the same address, so React may not re-render.</div>`,
  widgetTitle:'Same array or a copy?',
  widget(el){
    let a, b, ids, nextId, log;
    el.innerHTML=`<p>First create <code>b</code> one of two ways, then change it and look at <code>a</code>.</p>
      <div class="controls"><button class="btn mono" id="a3ref">const b = a</button><button class="btn mono" id="a3copy">const b = [...a]</button><button class="btn accent" id="a3reset">Reset</button></div>
      <div class="controls"><button class="btn mono ghost" id="a3push" disabled>b.push(4)</button><button class="btn mono ghost" id="a3set" disabled>b[0] = 99</button></div>
      <div id="a3vars"></div><div class="readout" id="a3out"></div>`;
    const idOf=arr=>{ if(!ids.has(arr)) ids.set(arr, nextId++); return ids.get(arr); };
    const draw=()=>{
      const box=$('#a3vars',el); box.innerHTML='';
      [['a',a],['b',b]].forEach(([name,arr])=>{
        if(!arr) return;
        const row=h('div',{class:'refrow'});
        row.append(h('div',{class:'refname'},`<span class="var"><b>${name}</b></span> → <span class="pill ${idOf(arr)===1?'good':'blue'}">array #${idOf(arr)}</span>`));
        const boxes=h('div'); renderBoxes(boxes,arr,{cls:()=> b && a===b ? 'hl':''}); row.append(boxes); box.append(row);
      });
      const shared = b && a===b;
      $('#a3out',el).innerHTML = log + (b ? `\n// a === b → <b>${shared}</b>${shared?'  (one array, two names)':'  (two separate arrays)'}` : '');
      $('#a3push',el).disabled = $('#a3set',el).disabled = !b;
      $('#a3ref',el).disabled = $('#a3copy',el).disabled = !!b;
    };
    const reset=()=>{ a=[1,2,3]; b=null; ids=new Map(); nextId=1; log='const a = [1, 2, 3];'; draw(); };
    $('#a3ref',el).onclick=()=>{ b=a; log+='\nconst b = a;'; draw(); };
    $('#a3copy',el).onclick=()=>{ b=[...a]; log+='\nconst b = [...a];'; draw(); };
    $('#a3push',el).onclick=()=>{ b.push(4); log+='\nb.push(4);   // a is now '+fmt(a); draw(); };
    $('#a3set',el).onclick=()=>{ b[0]=99; log+='\nb[0] = 99;   // a is now '+fmt(a); draw(); };
    $('#a3reset',el).onclick=reset;
    reset();
  },
  quiz:[
    {q:'<code>const a = [1]; const b = a; b.push(2);</code>. What is <code>a</code>?', opts:['[1]','[1, 2]','[2]','Error: a is const'], a:1, why:'b and a point at the same array, so pushing through b changes what a sees.'},
    {q:'What does <code>[1, 2] === [1, 2]</code> give?', opts:['true','false','undefined','An error'], a:1, why:'=== on arrays compares addresses, not contents. These are two separate arrays.'},
    {q:'<code>const [x, ...rest] = [5, 6, 7];</code>. What is <code>rest</code>?', opts:['7','[6, 7]','[5, 6, 7]','6'], a:1, why:'x takes the first item; ...rest collects everything left into a new array.'},
  ],
  exercise:{
    task:'<ol><li><code>copy</code>: a real copy of <code>original</code> using spread, then push <code>4</code> onto <code>copy</code> (original must stay <code>[1, 2, 3]</code>)</li><li><code>combined</code>: <code>original</code> and <code>extra</code> merged into one new array using spread</li><li>Use destructuring on <code>original</code> to create <code>first</code> (the first item) and <code>others</code> (the rest)</li></ol>',
    starter:`const original = [1, 2, 3];\nconst extra = [10, 20];\n\nconst copy = \n\n\nconst combined = \n\n// destructure first and others from original\n\n\nconsole.log(original, copy, combined, first, others);`,
    extract: varsExtract(['original','copy','combined','first','others']),
    tests:(v,code)=>[
      [same(v.copy,[1,2,3,4]), 'copy is [1, 2, 3, 4]'],
      [same(v.original,[1,2,3]), 'original is still [1, 2, 3]'],
      [same(v.combined,[1,2,3,10,20]), 'combined is [1, 2, 3, 10, 20]'],
      [v.first===1 && same(v.others,[2,3]) && /\[\s*first\s*,\s*\.\.\.\s*others\s*\]/.test(code), 'first is 1 and others is [2, 3] (using destructuring)'],
      [(code.match(/\.\.\./g)||[]).length>=3, 'used spread ... for the copy and the merge'],
    ],
    hint:'<code>const copy = [...original];</code> then <code>copy.push(4);</code>. Merge with <code>[...original, ...extra]</code>, and destructure with <code>const [first, ...others] = original;</code>',
    solution:`const original = [1, 2, 3];\nconst extra = [10, 20];\n\nconst copy = [...original];\ncopy.push(4);\n\nconst combined = [...original, ...extra];\n\n// destructure first and others from original\nconst [first, ...others] = original;\n\nconsole.log(original, copy, combined, first, others);`
  }
},

/* A5 */ {
  id:'adv-grid', level:'adv', part:'Part 2 · Real world', title:'Nested arrays & 2D grids', short:'2D grids',

  lesson:`
<pre><span class="k">const</span> board = [
  [<span class="s">"X"</span>, <span class="s">"O"</span>, <span class="s">"X"</span>],   <span class="c">// row 0</span>

board[<span class="n">1</span>][<span class="n">2</span>]       <span class="c">// "O"   ← row 1, then column 2</span>

board[<span class="n">0</span>].length   <span class="c">// 3     ← number of columns</span></pre>
    <p>The rule is <b>row first, column second</b>: <code>grid[row][col]</code>. The first <code>[ ]</code> picks a row (which is itself an array), and the second picks an item inside that row.</p>
    <p>To visit every cell, put a loop inside a loop:</p>

  }
}</pre>
    <div class="tip">💡 The inner loop runs all the way through for <b>every single</b> pass of the outer loop, so a 3 × 4 grid runs the inner body 12 times.</div>`,

    <p>Read it top to bottom like a recipe. Each line receives the array produced by the line above it.</p>

    <p><b>Order matters.</b> To get the names of the top 3, you must <code>sort</code> before <code>slice</code>, and <code>map</code> to names last. Once you've mapped to strings, the ratings are gone.</p>

      {code:'.filter(m => m.rating >= 8)', f:a=>a.filter(m=>m.rating>=8)},

    starter:`const players = [\n  { name: "Kai", score: 72 },\n  { name: "Lea", score: 95 },\n  { name: "Max", score: 60 },\n  { name: "Noa", score: 88 },\n  { name: "Ola", score: 91 },\n];\n\nconst topNames = players\n  // your chain here\n\n\nconsole.log(topNames);`,

/* A7 */ {
  id:'adv-final', level:'adv', part:'Part 2 · Real world', title:'Advanced final: the leaderboard', short:'Final: leaderboard',
  lead:'Real data arrives messy. You get a log of individual match results, with players appearing many times, and you need to turn it into a ranked leaderboard. This uses nearly everything from the advanced section.',
  lesson:`

<pre><span class="k">const</span> matches = [
  { player: <span class="s">"Ana"</span>, points: <span class="n">10</span> },
  { player: <span class="s">"Ben"</span>, points: <span class="n">5</span> },

    <p>A good plan is to build a <code>totals</code> array of <code>{ player, total }</code> objects:</p>

      <div class="cheat"><code>slice(s, e)</code><br>copy a part (original untouched)</div>

      <div class="cheat"><code>arr.map(o =&gt; o.key)</code><br>pluck a property from objects</div>

  widget:null,
  quiz:[
    {q:'<code>totals.find(t =&gt; t.player === "Zoe")</code> when Zoe isn\'t in totals returns…', opts:['-1','null','undefined','An empty object'], a:2, why:'find gives undefined when nothing matches, which makes it easy to check with <code>if (!existing)</code>.'},
    {q:'Which compare function sorts objects by <code>total</code>, highest first?', opts:['(a, b) => a.total - b.total','(a, b) => b.total - a.total','(a, b) => a - b','(a, b) => a.total > b.total'], a:1, why:'b − a puts larger values first. You must compare the .total property, not the objects themselves.'},

  ],
  exercise:{
    task:'Write <code>leaderboard(matches)</code> that returns the <b>top 3</b> players as <code>{ player, total }</code> objects, highest total first.<ol><li>Players appear multiple times, so add up all their points.</li><li>If two totals tie, put them in alphabetical order by name (<code>a.player.localeCompare(b.player)</code>).</li><li>Fewer than 3 players → return all of them. No matches → <code>[]</code>.</li><li>Don\'t change the <code>matches</code> array.</li></ol>',
    starter:`function leaderboard(matches) {\n  const totals = []; // e.g. [{ player: "Ana", total: 25 }]\n\n  // 1. loop through matches\n  //    use find() to see if the player is already in totals\n  //    yes → add the points   no → push a new { player, total }\n\n  // 2. sort totals: highest total first (ties → A–Z by name)\n\n  // 3. return only the top 3\n  return totals;\n}\n\nconsole.log(leaderboard([\n  { player: "Ana", points: 10 },\n  { player: "Ben", points: 5 },\n  { player: "Ana", points: 15 },\n  { player: "Cy",  points: 20 },\n  { player: "Ben", points: 12 },\n  { player: "Dee", points: 8 },\n  { player: "Cy",  points: 3 },\n]));`,

      const copy = JSON.stringify(m1);
      const a = leaderboard(m1);
      return { a, untouched: JSON.stringify(m1) === copy,
        b: leaderboard([{player:"Zed",points:5}]),
        c: leaderboard([{player:"Bo",points:10},{player:"Al",points:4},{player:"Cy",points:4},{player:"Al",points:6}]),
        d: leaderboard([]) };

        [same(clean(v.a),[{player:'Ana',total:25},{player:'Cy',total:23},{player:'Ben',total:17}]), 'main example → Ana 25, Cy 23, Ben 17'],
        [same(clean(v.b),[{player:'Zed',total:5}]), 'one player → [{ player: "Zed", total: 5 }]'],
        [same(clean(v.c),[{player:'Al',total:10},{player:'Bo',total:10},{player:'Cy',total:4}]), 'tie on 10 → Al before Bo'],

    hint:'Inside the loop: <code>const existing = totals.find(t =&gt; t.player === m.player);</code> then <code>if (existing) existing.total += m.points; else totals.push({ player: m.player, total: m.points });</code>. Sort with <code>(a, b) =&gt; b.total - a.total || a.player.localeCompare(b.player)</code>, then <code>return totals.slice(0, 3);</code>',

  }

/* ---------- app shell ---------- */
STAGES.forEach(s=>{ if(!s.level) s.level='basic'; });
const LEVELS = { basic:{name:'Beginner', title:'Beginner course'}, adv:{name:'Advanced', title:'Advanced section'} };
const levelStages = lvl => STAGES.filter(s=>s.level===lvl);
const lastOf = lvl => { const L=levelStages(lvl); return L[L.length-1]; };
let current = 0;   // a stage index, or 'results-basic' / 'results-adv' / 'locked'
function isDone(s){ const st=stageState(s.id); return s.quiz.every((_,i)=>st.quiz[i]===true) && st.code; }
function advUnlocked(){ return isDone(lastOf('basic')) || progress._skip===true; }
function isLocked(s){ return s.level==='adv' && !advUnlocked(); }
function advStarted(){ return levelStages('adv').some(s=>{ const p=progress[s.id]; return p && (p.code || Object.keys(p.quiz||{}).length || p.runs); }); }

function updateNav(){
  const nav=$('#nav'); nav.innerHTML=''; let lastLevel=null, lastPart=null;
  STAGES.forEach((s,i)=>{
    if(s.level!==lastLevel){
      if(lastLevel) addResultsLink(nav,lastLevel);
      nav.append(h('div',{class:'nav-h'}, LEVELS[s.level].name + (s.level==='adv' && !advUnlocked() ? ' <span class="lock">🔒</span>' : '')));
      lastLevel=s.level; lastPart=null;
    }
    if(s.part && s.part!==lastPart){ nav.append(h('div',{class:'nav-sub'}, s.part)); lastPart=s.part; }
    const done=isDone(s), locked=isLocked(s);
    const num=levelStages(s.level).indexOf(s)+1;
    nav.append(h('button',{class:(i===current?'active ':'')+(done?'done ':'')+(locked?'locked':''), onclick:()=>{go(i); $('#side').classList.remove('open');}},
      `<span class="dot">${done?'✓':num}</span><span>${s.short}</span>`));
  });
  addResultsLink(nav,lastLevel);
  const n=STAGES.filter(isDone).length;
  $('#bar').style.width = (n/STAGES.length*100)+'%';
  $('#barLabel').textContent = `${n} of ${STAGES.length} stages complete`;
}
function addResultsLink(nav,lvl){
  if(!resultsUnlocked(lvl)) return;
  const key='results-'+lvl;
  nav.append(h('button',{class:(current===key?'active':''), onclick:()=>{go(key); $('#side').classList.remove('open');}},
    `<span class="dot">★</span><span>${LEVELS[lvl].name} results</span>`));
}
function go(i){ current=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderLocked(s){
  $('#main').innerHTML=`
    <div class="eyebrow">Advanced section</div>
    <h1>🔒 Finish the beginner course first</h1>
    <p class="lead">The advanced section builds on everything from the beginner stages. It unlocks when you pass the beginner final challenge.</p>
    <section class="card"><p>You're at <b>${levelStages('basic').filter(isDone).length} of ${levelStages('basic').length}</b> beginner stages. If you already know the basics, you can skip ahead. Your beginner progress won't be affected.</p>
      <div class="controls"><button class="btn accent" id="toBasic">Continue the beginner course</button><button class="btn ghost" id="skip">Skip ahead anyway</button></div></section>`;
  $('#toBasic').onclick=()=>{ const i=STAGES.findIndex(x=>x.level==='basic' && !isDone(x)); go(i<0?0:i); };
  $('#skip').onclick=()=>{ progress._skip=true; save(); go(STAGES.indexOf(s)); };
  updateNav();
}

function render(){
  if(typeof current==='string' && current.startsWith('results-')){
    const lvl=current.slice(8); if(resultsUnlocked(lvl)) return renderResults(lvl); current=0;
  }
  const s=STAGES[current], st=stageState(s.id), main=$('#main');
  if(isLocked(s)) return renderLocked(s);
  const L=levelStages(s.level), k=L.indexOf(s), isLast=k===L.length-1;
  const prev=STAGES[current-1], next=STAGES[current+1];
  const doneMsg = !isLast ? 'Ready for the next one?' : s.level==='basic' ? 'You\'ve finished the beginner course. You know arrays now. 🎉' : 'You\'ve finished the advanced section. Serious array skills. 🚀';
  main.innerHTML=`
    <div class="eyebrow">${LEVELS[s.level].name}${s.part?' · '+s.part:''} · Stage ${k+1} of ${L.length}</div>
    <h1>${s.title}</h1>
    <p class="lead">${s.lead}</p>
    <div class="checklist" id="chk"></div>
    <section class="card"><h2><span class="tag">LEARN</span>The idea</h2>${s.lesson}</section>
    ${s.widget?`<section class="card"><h2><span class="tag">PLAY</span>${s.widgetTitle}</h2><div id="widget"></div></section>`:''}
    <section class="card"><h2><span class="tag">CHECK</span>Quick quiz</h2><div id="quiz"></div></section>
    <section class="card"><h2><span class="tag">CODE</span>Your turn</h2>
      <div class="task">${s.exercise.task}</div>
      <textarea class="editor" id="ed" spellcheck="false"></textarea>
      <div class="controls">
        <button class="btn accent" id="run">▶ Run &amp; check</button>
        <button class="btn ghost" id="hintBtn">Hint</button>
        <button class="btn ghost" id="solBtn">Show solution</button>
        <button class="btn ghost" id="resetCode">Reset code</button>
      </div>
      <div class="hint tip" id="hint">${s.exercise.hint}</div>
      <div class="console" id="cons"><span class="lbl">Console</span>(run your code to see output)</div>
      <div class="results" id="res"></div>
    </section>
    <div class="stage-done" id="doneBanner"><div><b style="font-size:18px">Stage complete!</b><br>${doneMsg}</div><button class="btn" id="nextBtn">${isLast?'See my results →':'Next stage →'}</button></div>
    <div class="footer-nav">
      ${prev?`<button class="btn ghost" id="prev">← ${prev.short}</button>`:'<span></span>'}
      ${next?`<button class="btn ghost" id="next">${next.level!==s.level?'Advanced: ':''}${next.short} →</button>`:'<span></span>'}
    </div>`;
  if(s.widget) s.widget($('#widget'));
  renderQuiz(s);
  setupEditor(s);
  if($('#prev')) $('#prev').onclick=()=>go(current-1);
  if($('#next')) $('#next').onclick=()=>go(current+1);
  $('#nextBtn').onclick=()=>go(isLast ? 'results-'+s.level : current+1);
  refreshStatus(false);
  updateNav();
}

function refreshStatus(celebrate){
  if(typeof current!=='number') return;
  const s=STAGES[current], st=stageState(s.id);
  const qOk=s.quiz.every((_,i)=>st.quiz[i]===true);
  $('#chk').innerHTML = `<span class="${qOk?'ok':''}">${qOk?'✓':'○'} Quiz</span><span class="${st.code?'ok':''}">${st.code?'✓':'○'} Code challenge</span>`;
  const done=isDone(s);
  const wasShown=$('#doneBanner').classList.contains('show');
  $('#doneBanner').classList.toggle('show',done);
  if(done && celebrate && !wasShown) confetti();
  updateNav();
}

function renderQuiz(s){
  const st=stageState(s.id), box=$('#quiz'); box.innerHTML='';
  s.quiz.forEach((q,qi)=>{
    const wrap=h('div',{class:'q'});
    wrap.append(h('div',{class:'q-title'},`${qi+1}. ${q.q}`));
    const opts=h('div',{class:'opts'}); const why=h('div',{class:'why'}); why.style.display='none';
    q.opts.forEach((o,oi)=>{
      const b=h('button',{class:'opt'},`<span class="letter">${'ABCD'[oi]}</span><span>${esc(o).replace(/&lt;code&gt;|&lt;\/code&gt;/g,'')}</span>`);
      b.onclick=()=>{
        opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));
        const ok=oi===q.a; b.classList.add(ok?'right':'wrong');
        why.style.display='block'; why.className='why '+(ok?'right':'wrong');
        why.innerHTML = ok ? `<b>Correct.</b> ${q.why}` : `<b>Not quite. Try again.</b>`;
        if(ok){ st.quiz[qi]=true; save(); refreshStatus(true); }
        else if(st.quiz[qi]!==true){ st.qWrong[qi]=(st.qWrong[qi]||0)+1; save(); }
      };
      opts.append(b);
      if(st.quiz[qi]===true && oi===q.a){ b.classList.add('right'); why.style.display='block'; why.className='why right'; why.innerHTML=`<b>Correct.</b> ${q.why}`; }
    });
    wrap.append(opts, why); box.append(wrap);
  });
}

function setupEditor(s){
  const st=stageState(s.id), ed=$('#ed');
  ed.value = st.draft ?? s.exercise.starter;
  ed.style.height = Math.max(200, (ed.value.split('\n').length+2)*22.4) + 'px';
  ed.addEventListener('input',()=>{ st.draft=ed.value; save(); });
  ed.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault(); const a=ed.selectionStart,b=ed.selectionEnd; ed.value=ed.value.slice(0,a)+'  '+ed.value.slice(b); ed.selectionStart=ed.selectionEnd=a+2; st.draft=ed.value; save(); }
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); $('#run').click(); }
  });
  $('#hintBtn').onclick=()=>{ $('#hint').classList.toggle('show'); if(!st.code){ st.hint=true; save(); } };
  $('#solBtn').onclick=()=>{ ed.value=s.exercise.solution; st.draft=ed.value; if(!st.code) st.sol=true; save(); };
  $('#resetCode').onclick=()=>{ ed.value=s.exercise.starter; st.draft=null; save(); $('#res').innerHTML=''; $('#cons').innerHTML='<span class="lbl">Console</span>(run your code to see output)'; };
  $('#run').onclick=async()=>{
    const code=ed.value;
    if(!st.code){ st.runs=(st.runs||0)+1; save(); }
    $('#run').disabled=true; $('#cons').innerHTML='<span class="lbl">Console</span>running…';
    const r=await runCode(code, s.exercise.extract);
    $('#run').disabled=false;
    let out = r.logs.length ? r.logs.map(esc).join('\n') : '(nothing logged)';
    if(!r.ok) out += `\n<span class="err">⚠ ${esc(friendly(r.error))}</span>`;
    $('#cons').innerHTML = '<span class="lbl">Console</span>' + out;
    const res=$('#res'); res.innerHTML='';
    if(!r.ok){ res.append(h('div',{class:'res fail'},'✗ Fix the error above, then run again.')); return; }
    const vals = r.vals && typeof r.vals==='object' ? r.vals : {};
    const tests=s.exercise.tests(vals, code.replace(/\/\/.*$/gm,''));
    tests.forEach(([pass,label])=>res.append(h('div',{class:'res '+(pass?'pass':'fail')},(pass?'✓ ':'✗ ')+label)));
    if(tests.every(t=>t[0])){ st.code=true; save(); refreshStatus(true); }
  };
}

/* ---------- results / scoring ---------- */
function resultsUnlocked(lvl){ return isDone(lastOf(lvl)); }
function scoreStage(s){
  const st=stageState(s.id), n=s.quiz.length;
  let quizPts=0, firstTry=0;
  s.quiz.forEach((_,i)=>{
    if(st.quiz[i]!==true) return;
    const w=st.qWrong[i]||0; if(w===0) firstTry++;
    quizPts += (50/n) * (w===0 ? 1 : w===1 ? 0.5 : 0.25);
  });
  let codePts=0, codeNote='Not passed yet';
  if(st.code){
    if(st.sol){ codePts=10; codeNote='Passed after viewing the solution'; }
    else {
      const extra=Math.max(0,(st.runs||1)-1);
      codePts = 50 - (st.hint?10:0) - Math.min(20, extra*5);
      codeNote = (st.runs<=1 ? 'Passed on the first run' : `Passed after ${st.runs} runs`) + (st.hint ? ' · used a hint' : '');
    }
  }
  return { score:Math.round(quizPts+codePts), quizPts:Math.round(quizPts), codePts, firstTry, n, codeNote, done:isDone(s), st };
}
function grade(p, lvl){
  const adv = lvl==='adv';
  if(p>=90) return {t: adv?'Array Wizard':'Array Master', e: adv?'🧙':'🏆', m: adv?'Outstanding. You can handle real-world array data confidently.':'Excellent. You clearly understand arrays and can use them on your own.'};
  if(p>=75) return {t:'Solid Foundation', e:'💪', m:'Strong work. A quick review of the stages listed below will make it stick.'};
  if(p>=60) return {t:'Getting There', e:'🌱', m:'You have the core ideas. Revisit the weaker stages and redo their challenges.'};
  return {t:'Keep Practising', e:'📚', m:'These ideas take practice. Go back through the stages listed below, and try the challenges again without hints.'};
}
function renderResults(lvl){
  const L=levelStages(lvl);
  const rows=L.map(s=>({s, ...scoreStage(s)}));
  const total=Math.round(rows.reduce((a,r)=>a+r.score,0)/rows.length);
  const g=grade(total,lvl);
  const qTotal=rows.reduce((a,r)=>a+r.n,0), qFirst=rows.reduce((a,r)=>a+r.firstTry,0);
  const solo=rows.filter(r=>r.st.code && !r.st.sol).length;
  const hints=rows.filter(r=>r.st.hint).length;
  const runs=rows.reduce((a,r)=>a+(r.st.runs||0),0);
  const weak=rows.filter(r=>r.score<70);
  const strong=rows.filter(r=>r.score>=90).map(r=>r.s.short);
  const C=2*Math.PI*54, col = total>=75?'var(--good)': total>=60?'var(--yellow)':'var(--accent)';
  const undone=rows.filter(r=>!r.done).length;
  const nextCard = lvl==='basic'
    ? `<section class="card"><h2><span class="tag">NEXT</span>Ready for more?</h2><p>The <b>advanced section</b> covers find/some/every, slice vs splice, sorting, copies vs references, arrays of objects, 2D grids and method chaining, ending with a leaderboard challenge.</p><div class="controls"><button class="btn accent" data-go="${STAGES.findIndex(s=>s.level==='adv')}">Start the advanced section →</button></div></section>`
    : `<section class="card"><h2><span class="tag">NEXT</span>Where to go from here</h2><p>Next, try <code>reduce</code> (folding an array into one value), <code>flat</code>/<code>flatMap</code>, <code>Array.from</code>, and the non-mutating <code>toSorted</code>/<code>toSpliced</code>. Then practise on real API data.</p></section>`;
  $('#main').innerHTML=`
    <div class="eyebrow">${LEVELS[lvl].title} complete</div>
    <h1>Your ${LEVELS[lvl].name.toLowerCase()} results</h1>
    <p class="lead">How you did across the ${L.length} ${lvl==='adv'?'advanced':'beginner'} stages. You score higher for answering quizzes right first time and for solving challenges without hints or the solution.</p>
    ${undone?`<div class="tip">You finished the final challenge but skipped ${undone} stage${undone>1?'s':''}. Those count as 0 until you complete them.</div>`:''}
    <section class="card result-hero">
      <svg width="140" height="140" viewBox="0 0 140 140" aria-label="Overall score ${total}%">
        <circle cx="70" cy="70" r="54" fill="none" stroke="var(--line)" stroke-width="14"/>
        <circle cx="70" cy="70" r="54" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-total/100)}" transform="rotate(-90 70 70)"/>
        <text x="70" y="78" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="32" fill="var(--ink)">${total}%</text>
      </svg>
      <div>
        <div class="grade">${g.e} ${g.t}</div>
        <p style="margin:6px 0 0;color:#3b372f">${g.m}</p>
        ${strong.length?`<p style="margin:10px 0 0;font-size:14.5px"><b>Strongest:</b> ${strong.join(', ')}</p>`:''}
      </div>
    </section>
    <div class="stats">
      <div class="stat"><div class="num">${qFirst}/${qTotal}</div><div class="lab">quiz questions right first try</div></div>
      <div class="stat"><div class="num">${solo}/${L.length}</div><div class="lab">challenges solved without the solution</div></div>
      <div class="stat"><div class="num">${hints}</div><div class="lab">hints used</div></div>
      <div class="stat"><div class="num">${runs}</div><div class="lab">code runs in total</div></div>
    </div>
    <section class="card">
      <h2><span class="tag">BREAKDOWN</span>Stage by stage</h2>
      <div class="rtable">
        <div class="rrow head"><span>Stage</span><span>Quiz</span><span>Code challenge</span><span>Score</span></div>
        ${rows.map((r,i)=>`
        <div class="rrow">
          <span><b>${i+1}.</b> ${r.s.short}</span>
          <span>${r.firstTry}/${r.n} first try</span>
          <span class="muted">${r.codeNote}</span>
          <span class="sc"><span class="minibar"><i style="width:${r.score}%;background:${r.score>=90?'var(--good)':r.score>=70?'var(--yellow)':'var(--accent)'}"></i></span><b>${r.score}</b></span>
        </div>`).join('')}
      </div>
      <p class="muted" style="font-size:13px;margin:12px 0 0">Each stage is worth 100: 50 for the quiz (full marks for right first time, half after one wrong answer) and 50 for the code challenge (−10 for a hint, −5 per extra run, capped at −20; 10 if you viewed the solution first).</p>
    </section>
    ${weak.length?`<section class="card"><h2><span class="tag">REVIEW</span>Worth another look</h2>
      <p>You scored under 70 on these stages. Reopen them and try the challenge again from scratch (use “Reset code”).</p>
      <div class="controls">${weak.map(r=>`<button class="btn ghost" data-go="${STAGES.indexOf(r.s)}">${L.indexOf(r.s)+1}. ${r.s.short} (${r.score})</button>`).join('')}</div></section>`:''}
    ${nextCard}
    <div class="controls"><button class="btn accent" id="retake">Retake the ${LEVELS[lvl].name.toLowerCase()} ${lvl==='adv'?'section':'course'}</button><button class="btn ghost" data-go="${STAGES.indexOf(L[0])}">Back to stage 1</button></div>`;
  $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $('#retake').onclick=()=>{
    const b=$('#retake');
    if(b.dataset.confirm){ if(lvl==='basic' && advUnlocked()) progress._skip=true; L.forEach(s=>delete progress[s.id]); save(); go(STAGES.indexOf(L[0])); }
    else { b.dataset.confirm='1'; b.textContent=`Click again to clear ${LEVELS[lvl].name.toLowerCase()} progress and retake`; }
  };
  updateNav();
}

function friendly(err){
  if(/Unexpected end of input/.test(err)) return err + ' (you may be missing a closing ] ) or })';
  if(/Unexpected token/.test(err)) return err + ' (check for a missing comma, quote, or bracket)';
  if(/is not defined/.test(err)) return err + ' (check the spelling; JavaScript is case-sensitive)';
  if(/Assignment to constant/.test(err)) return err + ' (a const variable can\'t be reassigned. Use let, or change the array\'s contents instead)';
  if(/Missing initializer/.test(err)) return err + ' (a const needs a value after the = sign)';
  return err;
}

function confetti(){
  const c=$('#confetti'); const cols=['#e2603a','#f3c64b','#2f8f5b','#2c5fd6','#1d1b16'];
  for(let i=0;i<60;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%cols.length]; p.style.animationDelay=Math.random()*.4+'s'; p.style.transform=`rotate(${Math.random()*360}deg)`; c.append(p); setTimeout(()=>p.remove(),2400); }
}

$('#menuBtn').onclick=()=>{ const a=$('#side'); a.classList.toggle('open'); $('#menuBtn').textContent=a.classList.contains('open')?'Hide stages':'Show stages'; };
$('#resetBtn').onclick=()=>{
  const b=$('#resetBtn');
  if(b.dataset.confirm){ progress={}; save(); delete b.dataset.confirm; b.textContent='Reset my progress'; go(0); }
  else { b.dataset.confirm='1'; b.textContent='Click again to confirm reset'; setTimeout(()=>{ delete b.dataset.confirm; b.textContent='Reset my progress'; },3000); }
};

// resume where the learner left off
(()=>{
  const b=STAGES.findIndex(s=>s.level==='basic' && !isDone(s));
  const a=STAGES.findIndex(s=>s.level==='adv' && !isDone(s));
  if(advStarted() && advUnlocked()) current = a>=0 ? a : 'results-adv';
  else if(b>=0) current = b;
  else current = 'results-basic';
})();
render();
</script>
